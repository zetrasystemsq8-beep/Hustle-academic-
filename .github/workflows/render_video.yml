name: Render Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      spec:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji

      - name: Report start
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"downloading","progress_pct":5}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Parse spec and download assets
        run: |
          echo '${{ github.event.inputs.spec }}' > spec.json
          mkdir -p clips stickers audio
          node - <<'EOF'
          const spec = require('./spec.json');
          const fs = require('fs');
          fs.writeFileSync('clip_urls.txt', spec.clips.map(c => c.assets.storage_path).join('\n'));
          fs.writeFileSync('sticker_urls.txt', (spec.stickers || []).filter(s => s.kind === 'image').map(s => s.content).join('\n'));
          fs.writeFileSync('audio_urls.txt', (spec.audio_tracks || []).map(a => a.storage_path).join('\n'));
          EOF
          while read -r path; do [ -n "$path" ] && curl -sL "$SUPABASE_STORAGE_URL/$path" -o "clips/$(basename "$path")"; done < clip_urls.txt
          while read -r path; do [ -n "$path" ] && curl -sL "$SUPABASE_STORAGE_URL/$path" -o "stickers/$(basename "$path")"; done < sticker_urls.txt
          while read -r path; do [ -n "$path" ] && curl -sL "$SUPABASE_STORAGE_URL/$path" -o "audio/$(basename "$path")"; done < audio_urls.txt
        env:
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_STORAGE_URL }}

      - name: Report transcoding
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"transcoding","progress_pct":20}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Trim and transform each clip
        run: |
          node - <<'EOF' > trim_commands.sh
          const spec = require('./spec.json');
          spec.clips.forEach((c, i) => {
            const inFile = `clips/${c.assets.storage_path.split('/').pop()}`;
            const start = c.source_start_ms / 1000;
            const dur = (c.source_end_ms - c.source_start_ms) / 1000;

            const vf = [];
            const rot = c.rotation_deg || 0;
            if (rot === 90) vf.push('transpose=1');
            else if (rot === 180) vf.push('transpose=1,transpose=1');
            else if (rot === 270) vf.push('transpose=2');

            const scale = c.scale || 1.0;
            if (scale !== 1.0) vf.push(`scale=iw*${scale}:ih*${scale}`);

            const speed = c.speed || 1.0;
            const afParts = [];
            if (speed !== 1.0) {
              vf.push(`setpts=(1/${speed})*PTS`);
              afParts.push(`atempo=${speed}`);
            }

            const vfArg = vf.length ? `-vf "${vf.join(',')}"` : '';
            const afArg = afParts.length ? `-af "${afParts.join(',')}"` : '';

            console.log(`ffmpeg -y -i "${inFile}" -ss ${start} -t ${dur} ${vfArg} ${afArg} -c:v libx264 -c:a aac "trimmed_${i}.mp4"`);
          });
          EOF
          bash trim_commands.sh

      - name: Report compositing
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"compositing","progress_pct":40}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Concat clips with per-pair transition types
        run: |
          node - <<'EOF' > transition_types.txt
          const spec = require('./spec.json');
          const clips = spec.clips;
          const transitions = spec.transitions || [];
          const typeMap = { crossfade: 'fade', zoom: 'zoomin', slide: 'slideleft', wipe: 'wipeleft' };
          const lines = [];
          for (let i = 1; i < clips.length; i++) {
            const t = transitions.find(t => t.from_clip_id === clips[i-1].id && t.to_clip_id === clips[i].id);
            lines.push(typeMap[t ? t.type : 'crossfade'] || 'fade');
          }
          console.log(lines.join('\n'));
          EOF
          FILES=(trimmed_*.mp4)
          cp "${FILES[0]}" concat_0.mp4
          IDX=0
          while IFS= read -r TYPE; do
            IDX=$((IDX+1))
            prev=$((IDX-1))
            ffmpeg -y -i "concat_${prev}.mp4" -i "${FILES[$IDX]}" \
              -filter_complex "xfade=transition=${TYPE}:duration=0.5:offset=2" \
              -c:v libx264 -c:a aac "concat_${IDX}.mp4"
          done < transition_types.txt
          cp "concat_$((${#FILES[@]}-1)).mp4" composed.mp4

      - name: Report filtering
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"filtering","progress_pct":55}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Apply filter preset
        run: |
          FILTER_PRESET=$(node -e "console.log(require('./spec.json').filter_preset || 'none')")
          case "$FILTER_PRESET" in
            warm) VF="colorbalance=rs=.3:gs=.1:bs=-.2" ;;
            cool) VF="colorbalance=rs=-.2:gs=.1:bs=.3" ;;
            bw) VF="hue=s=0" ;;
            vintage) VF="curves=preset=vintage" ;;
            vivid) VF="eq=saturation=1.6:contrast=1.1" ;;
            *) VF="" ;;
          esac
          if [ -n "$VF" ]; then
            ffmpeg -y -i composed.mp4 -vf "$VF" -c:a copy filtered.mp4
          else
            cp composed.mp4 filtered.mp4
          fi

      - name: Overlay stickers and emoji
        run: |
          node - <<'EOF' > sticker_filter.txt
          const spec = require('./spec.json');
          const stickers = spec.stickers || [];
          const parts = [];
          const inputs = [];
          let imgIndex = 1;
          stickers.forEach(s => {
            const startS = s.start_ms / 1000;
            const endS = s.end_ms / 1000;
            if (s.kind === 'image') {
              const fname = s.content.split('/').pop();
              inputs.push(`-i stickers/${fname}`);
              parts.push(`[0:v][${imgIndex}:v] overlay=W*${s.pos_x}-w/2:H*${s.pos_y}-h/2:enable='between(t,${startS},${endS})' [ov${imgIndex}]`);
              imgIndex++;
            } else {
              parts.push(`drawtext=text='${s.content}':fontfile=/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf:fontsize=48:x=W*${s.pos_x}-24:y=H*${s.pos_y}-24:enable='between(t,${startS},${endS})'`);
            }
          });
          require('fs').writeFileSync('sticker_inputs.txt', inputs.join(' '));
          console.log(parts.join(','));
          EOF
          STICKER_FILTER=$(cat sticker_filter.txt)
          STICKER_INPUTS=$(cat sticker_inputs.txt)
          if [ -n "$STICKER_FILTER" ]; then
            ffmpeg -y -i filtered.mp4 $STICKER_INPUTS -vf "$STICKER_FILTER" -c:a copy stickered.mp4 || cp filtered.mp4 stickered.mp4
          else
            cp filtered.mp4 stickered.mp4
          fi

      - name: Burn in text overlays
        run: |
          node - <<'EOF' > overlay_filter.txt
          const spec = require('./spec.json');
          const parts = spec.overlays.map(o =>
            `drawtext=text='${o.text.replace(/'/g, "")}':enable='between(t,${o.start_ms/1000},${o.end_ms/1000})':fontsize=36:fontcolor=white:x=(w-text_w)/2:y=h-100`
          );
          console.log(parts.join(','));
          EOF
          FILTER=$(cat overlay_filter.txt)
          if [ -n "$FILTER" ]; then
            ffmpeg -y -i stickered.mp4 -vf "$FILTER" -c:a copy texted.mp4
          else
            cp stickered.mp4 texted.mp4
          fi

      - name: Report audio cleanup
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"cleaning_audio","progress_pct":70}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Clean marked audio tracks (denoise, normalize, trim silence)
        run: |
          node - <<'EOF'
          const spec = require('./spec.json');
          const fs = require('fs');
          const tracks = spec.audio_tracks || [];
          const cmds = tracks
            .filter(a => a.cleaned)
            .map(a => {
              const fname = a.storage_path.split('/').pop();
              const cleanName = `audio/clean_${fname}`;
              return `ffmpeg -y -i "audio/${fname}" -af "afftdn=nf=-25,loudnorm=I=-16:TP=-1.5:LRA=11,silenceremove=start_periods=1:start_threshold=-40dB:stop_periods=-1:stop_threshold=-40dB" "${cleanName}"`;
            });
          fs.writeFileSync('cleanup_commands.sh', cmds.join('\n'));
          EOF
          bash cleanup_commands.sh || true

      - name: Mix audio tracks
        run: |
          node - <<'EOF' > audio_inputs.txt
          const spec = require('./spec.json');
          const tracks = spec.audio_tracks || [];
          const lines = tracks.map(a => {
            const fname = a.storage_path.split('/').pop();
            return a.cleaned ? `audio/clean_${fname}` : `audio/${fname}`;
          });
          console.log(lines.join('\n'));
          EOF
          AUDIO_COUNT=$(grep -c . audio_inputs.txt || true)
          if [ "$AUDIO_COUNT" -gt 0 ]; then
            INPUTS="-i texted.mp4"
            while read -r f; do INPUTS="$INPUTS -i $f"; done < audio_inputs.txt
            AMIX_INPUTS="[0:a]"
            for i in $(seq 1 "$AUDIO_COUNT"); do AMIX_INPUTS="${AMIX_INPUTS}[${i}:a]"; done
            ffmpeg -y $INPUTS -filter_complex "${AMIX_INPUTS}amix=inputs=$((AUDIO_COUNT+1)):duration=first:dropout_transition=2[aout]" \
              -map 0:v -map "[aout]" -c:v copy final.mp4
          else
            cp texted.mp4 final.mp4
          fi

      - name: Report encoding/uploading
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"progress_callback","payload":{"job_id":"${{ github.event.inputs.job_id }}","status":"uploading","progress_pct":88}}'
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload to Supabase Storage
        run: |
          OUT_PATH="${{ github.event.inputs.job_id }}.mp4"
          curl -s -X POST "$SUPABASE_STORAGE_URL/object/renders/$OUT_PATH" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            --data-binary @final.mp4
          echo "OUTPUT_URL=$SUPABASE_PUBLIC_URL/renders/$OUT_PATH" >> "$GITHUB_ENV"
        env:
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_STORAGE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLIC_URL: ${{ secrets.SUPABASE_PUBLIC_URL }}

      - name: Report done
        run: |
          curl -s -X POST "$SUPABASE_FN_URL" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"action\":\"progress_callback\",\"payload\":{\"job_id\":\"${{ github.event.inputs.job_id }}\",\"status\":\"done\",\"progress_pct\":100,\"output_url\":\"$OUTPUT_URL\"}}"
        env:
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
