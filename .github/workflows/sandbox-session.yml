name: Cyber Lab Sandbox Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Sandbox session ID'
        required: true
      user_id:
        description: 'Student user ID'
        required: true
      duration_minutes:
        description: 'How long to keep the sandbox alive'
        required: true
        default: '15'
      supabase_callback_url:
        description: 'Webhook to report the sandbox URL back to Supabase'
        required: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install security tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap nikto curl

      - name: Start Juice Shop
        run: |
          docker run -d -p 3000:3000 --name juiceshop bkimminich/juice-shop

      - name: Wait for Juice Shop to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up"
              break
            fi
            sleep 2
          done

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start tunnel and capture public URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n1)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "Tunnel ready: $URL"
              break
            fi
            sleep 2
          done

      - name: Report sandbox URL to Supabase
        run: |
          curl -s -X POST "${{ inputs.supabase_callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\":\"${{ inputs.session_id }}\",\"status\":\"running\",\"target_url\":\"$TUNNEL_URL\"}"

      - name: Poll for and execute terminal commands
        run: |
          END_TIME=$(( $(date +%s) + ${{ inputs.duration_minutes }} * 60 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            RESPONSE=$(curl -s -X GET \
              "$SUPABASE_URL/rest/v1/sandbox_commands?session_id=eq.${{ inputs.session_id }}&status=eq.pending&order=created_at.asc&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

            COMMAND_ID=$(echo "$RESPONSE" | grep -oE '"id":"[^"]*"' | head -n1 | cut -d'"' -f4)

            if [ -n "$COMMAND_ID" ]; then
              TOOL=$(echo "$RESPONSE" | grep -oE '"tool":"[^"]*"' | head -n1 | cut -d'"' -f4)
              ARGS=$(echo "$RESPONSE" | grep -oE '"args":"[^"]*"' | head -n1 | cut -d'"' -f4)

              curl -s -X PATCH "$SUPABASE_URL/rest/v1/sandbox_commands?id=eq.$COMMAND_ID" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d '{"status":"running"}'

              case "$TOOL" in
                curl)
                  OUTPUT=$(timeout 30 curl -s $ARGS 2>&1 | head -c 4000)
                  ;;
                nmap)
                  OUTPUT=$(timeout 60 nmap $ARGS 2>&1 | head -c 4000)
                  ;;
                nikto)
                  OUTPUT=$(timeout 90 nikto $ARGS 2>&1 | head -c 4000)
                  ;;
                *)
                  OUTPUT="Tool not permitted on this runner."
                  ;;
              esac

              ESCAPED_OUTPUT=$(echo "$OUTPUT" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")

              curl -s -X PATCH "$SUPABASE_URL/rest/v1/sandbox_commands?id=eq.$COMMAND_ID" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"status\":\"complete\",\"output\":$ESCAPED_OUTPUT,\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            fi

            sleep 3
          done

      - name: Report session expired
        if: always()
        run: |
          curl -s -X POST "${{ inputs.supabase_callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\":\"${{ inputs.session_id }}\",\"status\":\"expired\"}"
